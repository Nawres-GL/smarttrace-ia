services:
  # FastAPI backend
  - type: web
    name: smarttrace-api-staging
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: HISTORY_MODE
        value: atlas
      - key: NLP_MODE
        value: rules
      - key: RAG_USE_OLLAMA
        value: "0"
      - key: RAG_USE_EMBEDDINGS
        value: "0"
      - key: RAG_USE_LLM_PLANNER
        value: "0"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false

  # React frontend
  - type: web
    name: smarttrace-web-staging
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html